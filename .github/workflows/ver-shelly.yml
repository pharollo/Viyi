name: Ver Shelly (temporal)
on:
  workflow_dispatch: {}
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: |
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp({ projectId: "viyi-25a09" });
            const db = admin.firestore();
            (async () => {
              const s = await db.doc("dispositivos/shelly").get();
              console.log("SHELLY FULL:", JSON.stringify(s.data()));
              const us = await db.collection("usuarios").where("email","==","farolo@hotmail.com").get();
              for(const u of us.docs){ const d=u.data(); console.log("ADMIN uid:", u.id, "administraIds:", JSON.stringify(d.administraIds||[])); }
            })().catch(e=>{console.error("ERROR:", e.message); process.exit(1);});
          '
