name: Ver Shelly (temporal)
on:
  workflow_dispatch: {}
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: |
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp({ projectId: "viyi-25a09" });
            const db = admin.firestore();
            (async () => {
              // Inmueble del shelly y su cadena de padres
              let id = "inm_353def68d2224b2c";
              for (let i=0;i<6 && id;i++){
                const s = await db.doc("inmuebles/"+id).get();
                if(!s.exists){ console.log("INM", id, "NO EXISTE"); break; }
                const d=s.data();
                console.log("INM", id, JSON.stringify({nombre:d.nombre, tipo:d.tipo, padre:d.padre||d.parent||null}));
                id = d.padre || d.parent || null;
              }
              // Inmuebles del admin
              const us = await db.collection("usuarios").where("email","==","farolo@hotmail.com").get();
              for (const u of us.docs){
                const d=u.data();
                console.log("ADMIN inmuebles:", JSON.stringify(d.inmuebles||[]));
                console.log("ADMIN inmueblesIds:", JSON.stringify(d.inmueblesIds||[]));
                console.log("ADMIN rol:", d.rol, "activo:", d.activo);
              }
            })().catch(e=>{console.error("ERROR:", e.message); process.exit(1);});
          '
