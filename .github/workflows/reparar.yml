name: Reparar cadenas de inmuebles (una vez)

# Escaneo/remiendo de fichas fantasma. Se lanza a mano (workflow_dispatch) con
# el service account del despliegue. Temporal; se quita al terminar.
on:
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Instalar dependencias
        working-directory: functions
        run: npm ci
      - name: Autenticar con Firebase (service account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Correr la reparación
        working-directory: functions
        run: node reparar-cadenas.js
