name: Reparar cadenas de inmuebles (una vez)

# Diagnóstico + resync de las cadenas expandidas (inmueblesIds / administraIds).
# Se lanza A MANO desde Actions o con `gh workflow run`. Usa el mismo service
# account del despliegue; no toca código ni funciones.
on:
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        working-directory: functions
        run: npm ci

      - name: Autenticar con Firebase (service account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Correr la reparación
        working-directory: functions
        run: node reparar-cadenas.js
