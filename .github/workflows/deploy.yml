name: Desplegar backend a Firebase

# Frontend (docs/) lo publica GitHub Pages solo en cada push a main.
# Este workflow despliega SOLO el backend: Cloud Functions + reglas e índices de Firestore.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

# Evita despliegues pisándose si haces varios push seguidos.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias de las functions
        working-directory: functions
        run: npm ci

      - name: Autenticar con Firebase (service account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      # TUYA_BASE_URL es un parámetro (no secreto) que en local vive en
      # functions/.env (ignorado por git). Lo recreamos aquí para el deploy.
      # Se puede sobreescribir con una variable de repo TUYA_BASE_URL.
      #
      # ⚠️ Si se añade otro `defineString` en functions/index.js, HAY QUE
      # añadirlo también aquí: este paso REESCRIBE el .env, así que un parámetro
      # que falte deja el deploy pidiéndolo y, con --non-interactive, falla.
      - name: Configurar parámetros de las functions
        run: echo "TUYA_BASE_URL=${{ vars.TUYA_BASE_URL || 'https://openapi.tuyaus.com' }}" > functions/.env

      # Cloud Functions v2 falla a veces al actualizar alguna función porque el
      # healthcheck de Cloud Run choca con la cuota de CPU del proyecto (ver
      # memoria: el techo es nº funciones × maxInstances × cpu).
      #
      # ⚠️ El reintento a secas NO servía, y peor: TAPABA el fallo. Se creía que
      # "las ya desplegadas se saltan y solo se reintentan las pendientes", pero
      # la CLI compara el hash del FUENTE, que ya quedó escrito aunque la
      # actualización del servicio fallara. Resultado real (5-ago-2026):
      #
      #   Intento 1: Failed to update function adminSkins   ← cuota de CPU
      #   Intento 2: adminSkins Skipped (No changes detected)
      #              Deploy complete!                        ← verde, y rota
      #
      # Dos arreglos: se sella el paquete en cada intento para que el hash cambie
      # y nada se salte, y el reintento va SOLO a lo que falló (redesplegar las
      # 24 otra vez multiplica la contención de CPU que causó el fallo).
      #
      # --force es obligatorio aquí: consultarEstado usa minInstances: 1 (una
      # instancia siempre encendida para que no haya arranque en frío), y sin
      # --force la CLI aborta con "Pass the --force option to deploy functions
      # that increase the minimum bill". Ojo: --force también borra sin
      # preguntar las funciones que se quiten del código.
      - name: Desplegar functions y Firestore
        run: |
          set -o pipefail
          salida="$(mktemp)"
          objetivo="functions,firestore"
          for intento in 1 2 3; do
            echo "== Intento $intento de deploy ($objetivo) =="
            echo "$GITHUB_RUN_ID-$intento" > functions/.deploy-stamp
            if firebase deploy --only "$objetivo" --project viyi-25a09 --non-interactive --force 2>&1 | tee "$salida"; then
              echo "Deploy OK en el intento $intento"
              exit 0
            fi
            fallidas="$(grep -o 'Failed to update function [A-Za-z0-9_]*' "$salida" \
              | awk '{print $NF}' | sort -u | sed 's/^/functions:/' | paste -sd, - || true)"
            if [ -n "$fallidas" ]; then
              objetivo="$fallidas"
              echo "Quedaron pendientes: $objetivo"
            fi
            # 60s y no 25: si la causa es la cuota, hay que darle tiempo a Cloud
            # Run a retirar las revisiones viejas que la están ocupando.
            echo "El intento $intento falló; reintentando en 60s…"
            sleep 60
          done
          echo "El deploy falló tras 3 intentos."
          exit 1
