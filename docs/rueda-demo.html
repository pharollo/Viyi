<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rueda · prueba</title>
<style>
  :root{
    --fondo:#1b1c1e; --superficie:#212225; --texto:#e8eaec; --texto-suave:#8d9297;
    --primario:#a5ff2e; --frio:#5ec8ff; --calido:#ffbe6b;
    --sombra-oscura:rgba(0,0,0,.55); --sombra-clara:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--fondo);color:var(--texto);
    font-family:system-ui,-apple-system,sans-serif;padding:24px 16px 50px;}
  h1{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--texto-suave);text-align:center;margin:0 0 20px}
  .fila{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .tarjeta{background:var(--superficie);border-radius:20px;padding:16px 14px 14px;
    box-shadow:9px 9px 20px var(--sombra-oscura),-9px -9px 20px var(--sombra-clara);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .nombre{font-size:13px;font-weight:600;color:var(--texto-suave)}
  .valor{font-size:22px;font-weight:600;color:var(--primario);font-variant-numeric:tabular-nums}
  .frio .valor{color:var(--frio)}
  .calido .valor{color:var(--calido)}

  /* ---- Control: rodillo + arco de luces ---- */
  .ctrl{position:relative;width:150px;height:150px;touch-action:pan-x;
    -webkit-tap-highlight-color:transparent;cursor:grab}
  .ctrl:active{cursor:grabbing}
  .arco{position:absolute;inset:0;pointer-events:none}
  .led{position:absolute;width:7px;height:7px;border-radius:50%;
    background:#2c2e33;transform:translate(-50%,-50%);transition:background .12s,box-shadow .12s}
  .led.on{background:var(--primario);box-shadow:0 0 7px rgba(165,255,46,.9)}
  .frio .led.on{background:var(--frio);box-shadow:0 0 7px rgba(94,200,255,.9)}
  .calido .led.on{background:var(--calido);box-shadow:0 0 9px rgba(255,190,107,.95)}

  .rodillo{position:absolute;left:50%;top:50%;width:52px;height:132px;
    transform:translate(-50%,-50%);border-radius:13px;overflow:hidden;
    background:url('rueda-base.jpg?v=1') center/100% 100% no-repeat;
    box-shadow:0 6px 16px rgba(0,0,0,.6)}
  /* la franja moleteada: es la que se desplaza y da la ilusión de giro */
  .moleteado-caja{position:absolute;left:9px;right:9px;top:0;bottom:0;overflow:hidden}
  /* Franja alta que se desplaza con transform (compositor, sin repintar).
     La textura repite cada 150px, así que el giro se toma módulo 150. */
  .moleteado{position:absolute;left:0;right:0;top:-150px;height:450px;
    background:url('rueda-textura.jpg?v=1') center top/100% 150px repeat-y;
    opacity:.85;will-change:transform}
  /* brillo fijo del rodillo, para que se vea cilíndrico al girar */
  .brillo{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(255,255,255,.10) 22%,
      rgba(255,255,255,.03) 50%,rgba(255,255,255,.10) 78%,rgba(0,0,0,.75));}

  .pie{max-width:340px;margin:24px auto 0;font-size:13px;line-height:1.6;
    color:var(--texto-suave);text-align:center}
</style>
</head>
<body>
  <h1>Rueda · prueba</h1>

  <div class="fila">
    <div class="tarjeta">
      <span class="nombre">Persiana Estudio</span>
      <div class="ctrl" id="c-cortina">
        <div class="arco"></div>
        <div class="rodillo"><div class="moleteado-caja"><div class="moleteado"></div></div><div class="brillo"></div></div>
      </div>
      <span class="valor" id="v-cortina">60</span>
    </div>

    <div class="tarjeta frio">
      <span class="nombre">Aire Sala</span>
      <div class="ctrl" id="c-termo">
        <div class="arco"></div>
        <div class="rodillo"><div class="moleteado-caja"><div class="moleteado"></div></div><div class="brillo"></div></div>
      </div>
      <span class="valor" id="v-termo">23°</span>
    </div>
    <div class="tarjeta calido">
      <span class="nombre">Dimmer Master</span>
      <div class="ctrl" id="c-dimmer">
        <div class="arco"></div>
        <div class="rodillo"><div class="moleteado-caja"><div class="moleteado"></div></div><div class="brillo"></div></div>
      </div>
      <span class="valor" id="v-dimmer">40</span>
    </div>
  </div>

  <p class="pie" id="diag" style="margin-top:18px;font-size:12px">audio: toca la rueda para probar</p>
  <p class="pie">Arrastra el rodillo hacia arriba o abajo: gira, suena en cada
     paso y el arco de luces sube contigo.<br>
     El comando saldría al soltar, no en cada paso.</p>

<script>
(function(){
  // ---- Sonido del detente ----
  // HTMLAudio con WAV (no Web Audio: en iPhone no se desbloqueaba). Varios
  // elementos en rueda para que los clics rápidos no se pisen.
  // ---- Sonido del detente ----
  // Dos rutas: Web Audio (baja latencia) y HTMLAudio (respaldo). AMBAS se
  // preparan y desbloquean DENTRO del primer pointerdown: iOS solo permite
  // sonar lo que nace de un gesto. Antes el respaldo se creaba dentro de un
  // .catch() asíncrono —fuera del gesto— y quedaba mudo para siempre: si Web
  // Audio no decodificaba, no se oía nada en vez de oírse tarde.
  var ctx = null, buf = null, pool = null, iPool = 0, crudo = null;
  var diag = null;
  function nota(t){ if (!diag) diag = document.getElementById('diag'); if (diag) diag.textContent = t; }

  // El archivo se baja al cargar, así el primer arrastre no espera la red.
  fetch('tic-rueda.wav?v=3').then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){ crudo = ab; }).catch(function(){});

  function prepararAudio(){
    if (pool) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }

    // 1) Respaldo primero, y desbloqueado aquí mismo (dentro del gesto).
    pool = [];
    for (var i = 0; i < 4; i++) {
      var a = new Audio('tic-rueda.wav?v=3');
      a.preload = 'auto';
      try {
        a.muted = true;
        var pr = a.play();
        if (pr && pr.then) pr.then(function(){ this.pause(); this.currentTime = 0; this.muted = false; }.bind(a))
                             .catch(function(){ this.muted = false; }.bind(a));
        else { a.pause(); a.muted = false; }
      } catch(e){}
      pool.push(a);
    }
    nota('audio: listo (respaldo) · probando Web Audio…');

    // 2) Web Audio encima, si se puede: es el que suena a tiempo.
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { nota('audio: HTMLAudio (sin Web Audio)'); return; }
    try {
      ctx = new AC({ latencyHint: 'interactive' });
      var mudo = ctx.createBufferSource();
      mudo.buffer = ctx.createBuffer(1, 1, 22050);
      mudo.connect(ctx.destination); mudo.start(0);
      if (ctx.state === 'suspended') ctx.resume();
      var listo = crudo ? Promise.resolve(crudo)
        : fetch('tic-rueda.wav?v=3').then(function(r){ return r.arrayBuffer(); });
      listo.then(function(ab){ return ctx.decodeAudioData(ab.slice(0)); })
        .then(function(b){
          buf = b;
          var l = Math.round(((ctx.baseLatency||0) + (ctx.outputLatency||0)) * 1000);
          nota('audio: Web Audio ✓ · salida ~' + l + ' ms');
        })
        .catch(function(err){
          ctx = null;   // se sigue oyendo por el respaldo, que ya está vivo
          nota('audio: HTMLAudio · Web Audio no decodificó');
        });
    } catch(e){ ctx = null; nota('audio: HTMLAudio · Web Audio no arrancó'); }
  }

  function tic(){
    if (ctx && buf) {
      try { var s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(0); return; } catch(e){}
    }
    if (pool) {
      var a = pool[iPool++ % pool.length];
      try { a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function(){}); } catch(e){}
    }
  }

  // En la app instalada (standalone) iOS deja dormir la sesión de audio y la
  // despierta en cada sonido: ahí se va la latencia (en Safari no pasa). Se
  // mantiene el canal abierto con un tono inaudible mientras se usa la rueda.
  var vivo = null, vivoTimer = null;
  function canalAbrir(){
    clearTimeout(vivoTimer);
    if (!ctx || vivo) return;
    try {
      var osc = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001;
      osc.frequency.value = 40;
      osc.connect(g).connect(ctx.destination);
      osc.start();
      vivo = osc;
    } catch(e){}
  }
  function canalCerrarLuego(){
    clearTimeout(vivoTimer);
    vivoTimer = setTimeout(function(){
      if (!vivo) return;
      try { vivo.stop(); } catch(e){}
      vivo = null;
    }, 4000);
  }

  // ---- Control ----
  function control(cont, opts){
    var arco = cont.querySelector('.arco');
    var moleteado = cont.querySelector('.moleteado');
    var valor = opts.inicial;

    // Arco de lucesitas abrazando el rodillo por la derecha. El ángulo se mide
    // desde el eje horizontal: -SPAN abajo, +SPAN arriba, así el arco se comba
    // hacia afuera y nunca cruza por encima del rodillo.
    var N = opts.leds || 13, leds = [];
    var R = 60, CX = 75, CY = 75, SPAN = 58;   // radio > medio ancho del rodillo
    for (var i = 0; i < N; i++) {
      var ang = (-SPAN + (2 * SPAN * i / (N - 1))) * Math.PI / 180;
      var d = document.createElement('span');
      d.className = 'led';
      d.style.left = (CX + Math.cos(ang) * R) + 'px';
      d.style.top  = (CY - Math.sin(ang) * R) + 'px';
      leds.push(d); arco.appendChild(d);       // i=0 abajo … i=N-1 arriba
    }

    function pintar(){
      var frac = (valor - opts.min) / (opts.max - opts.min);
      var encendidos = Math.round(frac * N);
      leds.forEach(function(d, i){
        d.classList.toggle('on', i < encendidos);   // se llena de abajo hacia arriba
      });
      opts.salida.textContent = opts.fmt(valor);
    }

    // Gesto con inercia: al soltar, la rueda sigue girando y frenando sola,
    // marcando sus detentes, en vez de congelarse en seco. El comando sale
    // cuando de verdad se detiene.
    var PX_PASO = 7;          // px de arrastre por escalón
    var FRICCION = 0.94;      // cuánto conserva por frame (a 60fps)
    var VEL_MIN = 0.03;       // px/ms por debajo de lo cual se considera parada
    var giro = 0;             // px acumulados (mueve la textura)
    var giroAncla = 0, valorAncla = valor;
    var arrastrando = false, yUlt = 0, tUlt = 0, vel = 0, raf = null, valorAlTocar = valor;

    function aplicarGiro(){
      moleteado.style.transform =
        'translate3d(0,' + (((-giro % 150) + 150) % 150) + 'px,0)';
      var pasos = Math.round((giro - giroAncla) / PX_PASO);
      var bruto = valorAncla + pasos * opts.paso;
      var nuevo = Math.min(opts.max, Math.max(opts.min,
        Math.round(bruto / opts.paso) * opts.paso));
      if (nuevo !== valor) { tic(); valor = nuevo; pintar(); }
      // Tope: al llegar al extremo la inercia se corta, como un fin de carrera.
      if ((valor === opts.max && vel > 0) || (valor === opts.min && vel < 0)) vel = 0;
    }

    function asentado(){
      canalCerrarLuego();
      if (valor === valorAlTocar) return;      // no cambió: nada que mandar
      opts.salida.textContent = opts.fmt(valor) + ' ✓';   // aquí saldría el comando
      setTimeout(function(){ opts.salida.textContent = opts.fmt(valor); }, 900);
    }

    function inercia(){
      var t = performance.now();
      var dt = Math.min(34, t - tUlt);         // si el frame se atrasó, no saltar
      tUlt = t;
      giro += vel * dt;
      vel *= Math.pow(FRICCION, dt / 16.67);   // fricción independiente del fps
      aplicarGiro();
      if (Math.abs(vel) < VEL_MIN) { raf = null; asentado(); return; }
      raf = requestAnimationFrame(inercia);
    }

    cont.addEventListener('pointerdown', function(e){
      prepararAudio(); canalAbrir();
      if (raf) { cancelAnimationFrame(raf); raf = null; }   // atajar la inercia
      arrastrando = true;
      yUlt = e.clientY; tUlt = performance.now(); vel = 0;
      giroAncla = giro; valorAncla = valor; valorAlTocar = valor;
      if (cont.setPointerCapture) cont.setPointerCapture(e.pointerId);
    });
    cont.addEventListener('pointermove', function(e){
      if (!arrastrando) return;
      var t = performance.now();
      var dy = yUlt - e.clientY;               // arrastrar hacia arriba sube
      var dt = Math.max(1, t - tUlt);
      vel = dy / dt;                           // px/ms, para la inercia
      yUlt = e.clientY; tUlt = t;
      giro += dy;
      aplicarGiro();
    });
    function soltar(){
      if (!arrastrando) return;
      arrastrando = false;
      if (Math.abs(vel) > VEL_MIN) { tUlt = performance.now(); raf = requestAnimationFrame(inercia); }
      else asentado();
    }
    cont.addEventListener('pointerup', soltar);
    cont.addEventListener('pointercancel', soltar);

    pintar();
  }

  control(document.getElementById('c-cortina'), {
    min: 0, max: 100, paso: 5, inicial: 60, leds: 13,
    fmt: function(v){ return String(v); },
    salida: document.getElementById('v-cortina'),
  });
  control(document.getElementById('c-dimmer'), {
    min: 0, max: 100, paso: 5, inicial: 40, leds: 13,
    fmt: function(v){ return String(v); },
    salida: document.getElementById('v-dimmer'),
  });
  control(document.getElementById('c-termo'), {
    min: 16, max: 30, paso: 0.5, inicial: 23, leds: 13,
    fmt: function(v){ return (v % 1 ? v.toFixed(1) : v) + '°'; },
    salida: document.getElementById('v-termo'),
  });
})();
</script>
</body>
</html>
